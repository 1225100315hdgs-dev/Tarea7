name: vidrieria_cristal
description: Catalogo de una vidrieria (app de practica en Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Aqui se declaran las imagenes locales, si no se pone esto
  # Image.asset marca error porque no encuentra los archivos
  assets:
    - lib/assets/images/
